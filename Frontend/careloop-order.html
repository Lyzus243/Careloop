<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f1f5f9">
<title>Order</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f8fafc;
    --bg3: #f1f5f9;
    --text: #0f172a;
    --text2: #64748b;
    --text3: #94a3b8;
    --border: #e2e8f0;
    --border2: #cbd5e1;
    --blue: #4f46e5;
    --blue-2: #6366f1;
    --green: #059669;
    --green-2: #10b981;
    --red: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -200px, #e0e7ff 0%, transparent 60%),
      linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 0 120px;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font-family: inherit; }

  /* ─── The container — the "box" ─── */
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    box-shadow:
      0 40px 80px -20px rgba(15,23,42,.18),
      0 20px 40px -20px rgba(15,23,42,.12),
      0 0 0 1px rgba(15,23,42,.04);
    border-radius: 24px;
    overflow: hidden;
    margin-top: 24px;
    margin-bottom: 24px;
  }
  @media (max-width: 520px) {
    body { padding: 0 0 130px; }
    .app { border-radius: 0; margin: 0; box-shadow: none; min-height: 100vh; }
  }

  /* ─── Header strip ─── */
  .app-header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #fff;
    padding: 22px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .app-header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px 200px at 100% 0%, rgba(255,255,255,.14) 0%, transparent 60%);
    pointer-events: none;
  }
  .brand-logo {
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 22px; font-weight: 700;
    border: 1.5px solid rgba(255,255,255,.24);
    position: relative;
    z-index: 1;
  }
  .brand-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-txt { min-width: 0; flex: 1; position: relative; z-index: 1; }
  .brand-name { font-size: 1.15rem; font-weight: 800; margin: 0; line-height: 1.2; letter-spacing: -.01em; color: #fff; }
  .brand-sub { font-size: .78rem; color: rgba(255,255,255,.78); margin-top: 3px; }

  /* ─── Hero ─── */
  .hero { padding: 22px 20px 4px; }
  .hero-title { font-size: 1.35rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; }
  .hero-sub { font-size: .86rem; color: var(--text2); margin: 0; }

  /* ─── Category chips ─── */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 15px; border-radius: 50px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text2); font-size: .82rem; font-weight: 600;
    white-space: nowrap; transition: all .15s;
  }
  .chip.active { background: var(--text); border-color: var(--text); color: #fff; }

  /* ─── Product list ─── */
  .list { padding: 6px 20px 20px; }
  .product {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex; gap: 14px; align-items: center;
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .product:active { transform: scale(.995); }
  .product.unavailable { opacity: .5; }
  .p-thumb {
    width: 60px; height: 60px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    display: flex; align-items: center; justify-content: center;
    color: var(--blue); font-size: 22px; font-weight: 800;
    overflow: hidden;
  }
  .p-thumb { position: relative; }
  .p-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .p-body { flex: 1; min-width: 0; }
  .p-name { font-weight: 700; font-size: .95rem; color: var(--text); margin: 0 0 3px; }
  .p-meta { font-size: .76rem; color: var(--text3); }
  .p-price { font-weight: 800; color: var(--green); font-size: .92rem; margin-top: 6px; }
  .unavail-tag {
    display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .02em;
    padding: 2px 7px; border-radius: 5px; background: var(--bg3); color: var(--text3);
    margin-left: 6px; vertical-align: middle;
  }

  .add-btn {
    width: 36px; height: 36px; border-radius: 10px; background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 300; line-height: 1;
    box-shadow: 0 4px 12px rgba(79,70,229,.32);
    transition: transform .1s, background .15s;
  }
  .add-btn:active { transform: scale(.92); }
  .add-btn[disabled] { background: var(--bg3); color: var(--text3); box-shadow: none; cursor: default; }

  .qty-mini { display: flex; align-items: center; gap: 6px; }
  .qty-mini button {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 300; line-height: 1;
  }
  .qty-mini .minus { background: var(--bg3); color: var(--text); }
  .qty-mini .plus { background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.32); }
  .qty-mini .n { min-width: 20px; text-align: center; font-weight: 700; font-size: .9rem; }

  /* ─── Empty / error ─── */
  .state { padding: 60px 24px; text-align: center; color: var(--text2); font-size: .9rem; }
  .state-emoji { font-size: 40px; margin-bottom: 12px; }

  /* ─── Cart bar ─── */
  .cartbar {
    position: fixed; left: 50%; bottom: 16px; z-index: 40;
    width: calc(100% - 24px); max-width: 456px;
    transform: translate(-50%, 130%);
    transition: transform .28s cubic-bezier(.2,.9,.3,1);
    background: var(--text); color: #fff; border-radius: 18px;
    padding: 12px 14px 12px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 20px 50px -8px rgba(15,23,42,.4), 0 8px 24px -8px rgba(15,23,42,.3);
  }
  .cartbar.show { transform: translate(-50%, 0); }
  .cartbar-count {
    width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: .9rem; flex-shrink: 0;
  }
  .cartbar-info { flex: 1; min-width: 0; }
  .cartbar-lbl { font-size: .68rem; color: rgba(255,255,255,.65); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  .cartbar-total { font-weight: 800; font-size: 1rem; letter-spacing: -.01em; }
  .cartbar-cta {
    padding: 10px 16px; border-radius: 10px; background: #fff; color: var(--text);
    font-weight: 700; font-size: .86rem;
  }

  /* ─── Sheet ─── */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    backdrop-filter: blur(3px);
  }
  .sheet-back.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 61;
    width: 100%; max-width: 480px;
    transform: translate(-50%, 100%);
    max-height: 92vh; background: var(--bg);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -20px 60px rgba(15,23,42,.25);
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-handle { width: 42px; height: 5px; border-radius: 3px; background: var(--border2); margin: 10px auto 4px; }
  .sheet-head { padding: 6px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sheet-title { font-size: 1.08rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .sheet-close { font-size: 26px; line-height: 1; color: var(--text3); padding: 4px 8px; }
  .sheet-body { padding: 6px 20px 20px; overflow-y: auto; }
  .sheet-foot { padding: 14px 20px 20px; border-top: 1px solid var(--border); background: var(--bg); }

  /* ─── Cart line items ─── */
  .ci { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .ci:last-child { border-bottom: none; }
  .ci-body { flex: 1; min-width: 0; }
  .ci-name { font-weight: 700; font-size: .92rem; }
  .ci-price { font-size: .76rem; color: var(--text3); margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 2px; background: var(--bg3); border-radius: 10px; padding: 3px; }
  .qty-btn { width: 30px; height: 30px; border-radius: 8px; font-size: 18px; font-weight: 500; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .qty-btn:disabled { color: var(--text3); cursor: default; }
  .qty-n { min-width: 26px; text-align: center; font-weight: 700; font-size: .9rem; }
  .ci-total { font-weight: 800; font-size: .92rem; min-width: 76px; text-align: right; letter-spacing: -.01em; }

  /* ─── Form ─── */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .78rem; font-weight: 700; color: var(--text2); margin-bottom: 6px; letter-spacing: .01em; }
  .field input, .field textarea {
    width: 100%; padding: 12px 14px; border-radius: 11px;
    border: 1.5px solid var(--border); background: var(--bg);
    font-size: .92rem; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .field textarea { resize: vertical; min-height: 72px; }
  .field-hint { font-size: .72rem; color: var(--text3); margin-top: 5px; line-height: 1.4; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 11px; border-radius: 11px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text2); font-weight: 700; font-size: .88rem;
    transition: all .15s;
  }
  .seg button.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .totals { background: var(--bg2); border-radius: 14px; padding: 14px 16px; margin: 14px 0; border: 1px solid var(--border); }
  .totals-row { display: flex; justify-content: space-between; font-size: .88rem; padding: 4px 0; }
  .totals-row.big { font-weight: 800; font-size: 1rem; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); letter-spacing: -.01em; }

  .privacy-note {
    font-size: .74rem;
    color: var(--text3);
    line-height: 1.5;
    text-align: center;
    padding: 12px 4px 4px;
  }

  .primary-cta {
    width: 100%; padding: 15px; border-radius: 12px; background: var(--blue); color: #fff;
    font-weight: 800; font-size: .95rem; letter-spacing: -.005em;
    box-shadow: 0 10px 24px -8px rgba(79,70,229,.5);
    transition: transform .1s;
  }
  .primary-cta:active { transform: scale(.99); }
  .primary-cta:disabled { background: var(--bg3); color: var(--text3); box-shadow: none; cursor: default; }

  .bank-block { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 10px 0 14px; }
  .bank-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: .86rem; gap: 10px; }
  .bank-row + .bank-row { border-top: 1px dashed var(--border); }
  .bank-row .lbl { color: var(--text2); flex-shrink: 0; }
  .bank-row .val { font-weight: 700; text-align: right; word-break: break-word; }
  .copy-mini { color: var(--blue); font-weight: 700; font-size: .72rem; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); margin-left: 8px; flex-shrink: 0; }

  .receipt-drop {
    border: 2px dashed var(--border2); border-radius: 14px; padding: 22px 16px; text-align: center;
    background: var(--bg2); cursor: pointer; transition: all .15s;
  }
  .receipt-drop:active { border-color: var(--blue); }
  .receipt-drop.has-file { border-style: solid; border-color: var(--green-2); background: rgba(16,185,129,.06); }
  .receipt-icon { font-size: 26px; margin-bottom: 6px; }
  .receipt-title { font-weight: 700; font-size: .9rem; }
  .receipt-sub { font-size: .74rem; color: var(--text2); margin-top: 3px; }

  /* ─── Success ─── */
  .success { padding: 30px 16px 20px; text-align: center; }
  .success-emoji { font-size: 60px; margin-bottom: 14px; }
  .success-title { font-size: 1.35rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -.015em; }
  .success-body { color: var(--text2); font-size: .9rem; line-height: 1.6; max-width: 340px; margin: 0 auto; }

  .foot { text-align: center; font-size: .72rem; color: var(--text3); padding: 20px 20px 24px; letter-spacing: .02em; }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand-logo" id="brand-logo">?</div>
    <div class="brand-txt">
      <h1 class="brand-name" id="brand-name">Loading…</h1>
      <div class="brand-sub" id="brand-sub">Order from us</div>
    </div>
  </header>

  <div class="state" id="loading"><div class="state-emoji">⏳</div>Loading the menu…</div>
  <div class="state" id="error" style="display:none;"><div class="state-emoji">🔗</div><div id="error-msg">This order link is not valid.</div></div>

  <div id="content" style="display:none;">
    <section class="hero">
      <h2 class="hero-title" id="hero-title">Order online</h2>
      <p class="hero-sub">Pick what you like. Pay by bank transfer. Send us your receipt.</p>
    </section>
    <div class="chips" id="chips" style="display:none;"></div>
    <div class="list" id="product-list"></div>
    <div class="foot">Powered by Careloop</div>
  </div>
</div>

<div class="cartbar" id="cartbar">
  <div class="cartbar-count" id="cartbar-count">0</div>
  <div class="cartbar-info">
    <div class="cartbar-lbl">Your order</div>
    <div class="cartbar-total" id="cartbar-total">₦0.00</div>
  </div>
  <button class="cartbar-cta" onclick="openSheet()">View</button>
</div>

<div class="sheet-back" id="sheet-back" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 class="sheet-title" id="sheet-title">Your order</h2>
    <button class="sheet-close" onclick="closeSheet()">&times;</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div>

<script>
(function () {
  var slug = decodeURIComponent((window.location.pathname.split('/').filter(Boolean).pop() || ''));
  var data = null;
  var cart = {};
  var step = 'cart';
  var form = { customer_name:'', customer_phone:'', customer_birthday:'', delivery_type:'delivery', delivery_address:'', note_to_seller:'' };
  var receiptFile = null;
  var currentCat = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n) { try { return '\u20a6' + Number(n).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } catch (e) { return '\u20a6' + Number(n).toFixed(2); } }

  // Try to load the logo string in any common format — data URL, http URL, or base64
  // of PNG/JPEG/GIF/WEBP. Falls back to the initial letter only if all fail.
  function paintLogo(container, raw, fallbackChar) {
    container.textContent = fallbackChar || '?';
    if (!raw) return;
    var s = String(raw).trim();
    var candidates = [];
    if (/^data:image\//i.test(s) || /^https?:\/\//i.test(s) || /^\//.test(s)) {
      candidates.push(s);
    } else {
      var clean = s.replace(/\s/g, '');
      if (/^iVBOR/.test(clean))      candidates.push('data:image/png;base64,' + clean);
      else if (/^\/9j\//.test(clean))candidates.push('data:image/jpeg;base64,' + clean);
      else if (/^R0lGOD/.test(clean))candidates.push('data:image/gif;base64,' + clean);
      else if (/^UklGR/.test(clean)) candidates.push('data:image/webp;base64,' + clean);
      candidates.push('data:image/png;base64,'  + clean);
      candidates.push('data:image/jpeg;base64,' + clean);
      candidates.push('data:image/webp;base64,' + clean);
      candidates.push(clean);
    }
    var i = 0;
    (function tryNext() {
      if (i >= candidates.length) return;
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        // Re-encode through a canvas: strips C2PA metadata and other
        // odd chunks that some browsers refuse to render from <img>.
        try {
          var c = document.createElement('canvas');
          c.width  = img.naturalWidth;
          c.height = img.naturalHeight;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          var clean = new Image();
          clean.alt = '';
          clean.onload = function () { container.innerHTML = ''; container.appendChild(clean); };
          clean.onerror = function () { container.innerHTML = ''; container.appendChild(img); };
          clean.src = c.toDataURL('image/png');
        } catch (err) {
          // Canvas tainted or unavailable — fall back to the raw image
          container.innerHTML = '';
          container.appendChild(img);
        }
      };
      img.onerror = function () { i++; tryNext(); };
      img.alt = '';
      img.src = candidates[i];
    })();
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error-msg').textContent = msg;
  }

  function renderProducts() {
    var listEl = document.getElementById('product-list');
    var prods = data.products || [];
    var filtered = currentCat ? prods.filter(function (p) { return p.category === currentCat; }) : prods;
    if (!filtered.length) {
      listEl.innerHTML = '<div class="state" style="padding:32px 16px;"><div class="state-emoji">📭</div>Nothing here right now.</div>';
      return;
    }
    listEl.innerHTML = filtered.map(function (p) {
      var meta = [];
      if (p.unit_label) meta.push(p.unit_label);
      if (p.category && !currentCat) meta.push(p.category);
      var initial = (p.name || '?').charAt(0).toUpperCase();
      var thumb = '<div class="p-thumb">' + esc(initial)
        + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" onerror="this.remove()">' : '')
        + '</div>';
      var avail = p.is_available_today !== false;
      var qty = cart[p.id] || 0;
      var ctrl;
      if (!avail) {
        ctrl = '<button class="add-btn" disabled>+</button>';
      } else if (qty > 0) {
        ctrl = '<div class="qty-mini">' +
          '<button class="minus" onclick="dec(' + p.id + ')">\u2212</button>' +
          '<span class="n">' + qty + '</span>' +
          '<button class="plus" onclick="inc(' + p.id + ')">+</button>' +
          '</div>';
      } else {
        ctrl = '<button class="add-btn" onclick="inc(' + p.id + ')">+</button>';
      }
      return '<div class="product ' + (avail ? '' : 'unavailable') + '">' +
        thumb +
        '<div class="p-body">' +
          '<div class="p-name">' + esc(p.name) + (avail ? '' : '<span class="unavail-tag">Unavailable</span>') + '</div>' +
          (meta.length ? '<div class="p-meta">' + esc(meta.join(' \u00b7 ')) + '</div>' : '') +
          '<div class="p-price">' + money(p.price) + '</div>' +
        '</div>' +
        '<div>' + ctrl + '</div>' +
      '</div>';
    }).join('');
  }

  function renderChips() {
    var cats = [];
    (data.products || []).forEach(function (p) { if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
    cats.sort();
    var el = document.getElementById('chips');
    if (cats.length < 2) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = '<button class="chip ' + (currentCat === '' ? 'active' : '') + '" data-cat="">All</button>' +
      cats.map(function (c) { return '<button class="chip ' + (currentCat === c ? 'active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  }

  function inc(pid) { var cur = cart[pid] || 0; if (cur >= 100) return; cart[pid] = cur + 1; refreshAll(); }
  function dec(pid) { var cur = cart[pid] || 0; if (cur <= 1) delete cart[pid]; else cart[pid] = cur - 1; refreshAll(); }
  function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
  function cartTotal() {
    var t = 0;
    for (var k in cart) {
      var p = (data.products || []).find(function (x) { return String(x.id) === String(k); });
      if (p) t += Number(p.price) * cart[k];
    }
    return t;
  }
  function refreshAll() {
    renderProducts();
    var n = cartCount();
    var bar = document.getElementById('cartbar');
    if (n > 0) bar.classList.add('show'); else { bar.classList.remove('show'); closeSheet(); step = 'cart'; }
    document.getElementById('cartbar-count').textContent = n;
    document.getElementById('cartbar-total').textContent = money(cartTotal());
    if (document.getElementById('sheet').classList.contains('open')) renderSheet();
  }

  function openSheet() { document.getElementById('sheet-back').classList.add('open'); document.getElementById('sheet').classList.add('open'); renderSheet(); document.body.style.overflow = 'hidden'; }
  function closeSheet() { document.getElementById('sheet-back').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); document.body.style.overflow = ''; if (step === 'success') { step = 'cart'; cart = {}; refreshAll(); } }

  function renderSheet() {
    var t = document.getElementById('sheet-title');
    var body = document.getElementById('sheet-body');
    var foot = document.getElementById('sheet-foot');
    if (step === 'cart') { t.textContent = 'Your order'; renderCartStep(body, foot); }
    else if (step === 'checkout') { t.textContent = 'Checkout'; renderCheckoutStep(body, foot); }
    else { t.textContent = 'Order received'; renderSuccessStep(body, foot); }
  }

  function renderCartStep(body, foot) {
    var items = [];
    for (var k in cart) {
      var p = (data.products || []).find(function (x) { return String(x.id) === String(k); });
      if (p) items.push({ p: p, q: cart[k] });
    }
    if (!items.length) { body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text2);">Your cart is empty.</div>'; foot.innerHTML = ''; return; }
    body.innerHTML = items.map(function (it) {
      return '<div class="ci">' +
        '<div class="ci-body"><div class="ci-name">' + esc(it.p.name) + '</div><div class="ci-price">' + money(it.p.price) + (it.p.unit_label ? ' \u00b7 ' + esc(it.p.unit_label) : '') + '</div></div>' +
        '<div class="qty">' +
          '<button class="qty-btn" onclick="dec(' + it.p.id + ')">\u2212</button>' +
          '<span class="qty-n">' + it.q + '</span>' +
          '<button class="qty-btn" onclick="inc(' + it.p.id + ')"' + (it.q >= 100 ? ' disabled' : '') + '>+</button>' +
        '</div>' +
        '<div class="ci-total">' + money(Number(it.p.price) * it.q) + '</div>' +
      '</div>';
    }).join('');
    var sub = cartTotal();
    body.innerHTML += '<div class="totals"><div class="totals-row"><span>Subtotal</span><span>' + money(sub) + '</span></div><div class="totals-row big"><span>Total</span><span>' + money(sub) + '</span></div></div>';
    foot.innerHTML = '<button class="primary-cta" onclick="goCheckout()">Proceed to checkout</button>';
  }

  function renderCheckoutStep(body, foot) {
    var sub = cartTotal();
    var bank = data.bank || {};
    var bankHtml = '';
    if (bank.bank_name || bank.account_number || bank.account_name) {
      bankHtml = '<div class="bank-block">' +
        '<div style="font-size:.8rem;font-weight:800;margin-bottom:6px;letter-spacing:.01em;">Pay to</div>' +
        (bank.bank_name ? '<div class="bank-row"><span class="lbl">Bank</span><span class="val">' + esc(bank.bank_name) + '</span></div>' : '') +
        (bank.account_number ? '<div class="bank-row"><span class="lbl">Account</span><span class="val">' + esc(bank.account_number) + '<button class="copy-mini" onclick="copyText(\'' + esc(bank.account_number) + '\')">Copy</button></span></div>' : '') +
        (bank.account_name ? '<div class="bank-row"><span class="lbl">Name</span><span class="val">' + esc(bank.account_name) + '</span></div>' : '') +
      '</div>';
    }
    body.innerHTML =
      '<div class="field"><label>Your name *</label><input type="text" id="f-name" value="' + esc(form.customer_name) + '" placeholder="e.g. Ada Obi"></div>' +
      '<div class="field"><label>Phone number *</label><input type="tel" id="f-phone" value="' + esc(form.customer_phone) + '" placeholder="e.g. 0803 123 4567"><div class="field-hint">So ' + esc(data.business_name) + ' can reach you about this order.</div></div>' +
      '<div class="field"><label>Birthday (optional)</label><input type="date" id="f-bday" value="' + esc(form.customer_birthday) + '"><div class="field-hint">Add your birthday and ' + esc(data.business_name) + ' will send you a greeting.</div></div>' +
      '<div class="field"><label>Delivery or pickup</label><div class="seg">' +
        '<button class="' + (form.delivery_type === 'delivery' ? 'active' : '') + '" onclick="setDelivery(\'delivery\')">Delivery</button>' +
        '<button class="' + (form.delivery_type === 'pickup' ? 'active' : '') + '" onclick="setDelivery(\'pickup\')">Pickup</button>' +
      '</div></div>' +
      (form.delivery_type === 'delivery'
        ? '<div class="field"><label>Delivery address *</label><textarea id="f-addr" placeholder="Street, area, landmark">' + esc(form.delivery_address) + '</textarea></div>'
        : '') +
      '<div class="field"><label>Note to seller (optional)</label><textarea id="f-note" placeholder="e.g. no pepper, deliver after 5pm">' + esc(form.note_to_seller) + '</textarea></div>' +
      bankHtml +
      '<div class="field"><label>Payment receipt *</label>' +
        '<div class="receipt-drop' + (receiptFile ? ' has-file' : '') + '" onclick="document.getElementById(\'f-receipt\').click()">' +
          '<div class="receipt-icon">' + (receiptFile ? '✅' : '📎') + '</div>' +
          '<div class="receipt-title">' + (receiptFile ? esc(receiptFile.name) : 'Tap to upload your receipt') + '</div>' +
          '<div class="receipt-sub">' + (receiptFile ? 'Tap to change' : 'JPG or PNG, up to 5MB') + '</div>' +
        '</div>' +
        '<input type="file" id="f-receipt" accept="image/jpeg,image/png,image/jpg" style="display:none" onchange="pickReceipt(this)">' +
      '</div>' +
      '<div class="totals"><div class="totals-row big"><span>Total to pay</span><span>' + money(sub) + '</span></div></div>' +
      '<div class="privacy-note">Your details are used only by ' + esc(data.business_name) + ' for your order, greetings and updates.</div>';
    foot.innerHTML = '<button class="primary-cta" id="submit-btn" onclick="submitOrder()">I\u2019ve paid \u2014 send order</button>';
  }

  function renderSuccessStep(body, foot) {
    body.innerHTML = '<div class="success">' +
      '<div class="success-emoji">🎉</div>' +
      '<h3 class="success-title">Order received</h3>' +
      '<p class="success-body">' + esc(data.business_name) + ' will confirm your payment shortly and reach out on WhatsApp.</p>' +
    '</div>';
    foot.innerHTML = '<button class="primary-cta" onclick="closeSheet()">Done</button>';
  }

  function captureForm() {
    form.customer_name = (document.getElementById('f-name') || {}).value || '';
    form.customer_phone = (document.getElementById('f-phone') || {}).value || '';
    form.customer_birthday = (document.getElementById('f-bday') || {}).value || '';
    form.delivery_address = (document.getElementById('f-addr') || {}).value || '';
    form.note_to_seller = (document.getElementById('f-note') || {}).value || '';
  }

  window.setDelivery = function (t) { captureForm(); form.delivery_type = t; renderSheet(); };
  window.pickReceipt = function (inp) { if (inp.files && inp.files[0]) { captureForm(); receiptFile = inp.files[0]; renderSheet(); } };
  window.copyText   = function (t) { navigator.clipboard.writeText(t).catch(function () {}); };
  window.goCheckout = function () { step = 'checkout'; renderSheet(); };
  window.inc = inc;
  window.dec = dec;
  window.openSheet = openSheet;
  window.closeSheet = closeSheet;

  window.submitOrder = async function () {
    captureForm();
    form.customer_name = form.customer_name.trim();
    form.customer_phone = form.customer_phone.trim();
    form.delivery_address = form.delivery_address.trim();
    form.note_to_seller = form.note_to_seller.trim();
    if (!form.customer_name) return alert('Please enter your name.');
    if (!form.customer_phone) return alert('Please enter your phone number.');
    if (form.delivery_type === 'delivery' && !form.delivery_address) return alert('Please enter a delivery address.');
    if (!receiptFile) return alert('Please upload your payment receipt.');

    var payload = {
      customer_name: form.customer_name,
      customer_phone: form.customer_phone,
      customer_birthday: form.customer_birthday || null,
      delivery_type: form.delivery_type,
      delivery_address: form.delivery_address || null,
      note_to_seller: form.note_to_seller || null,
      items: Object.keys(cart).map(function (k) {
        var p = (data.products || []).find(function (x) { return String(x.id) === String(k); });
        return { product_id: parseInt(k, 10), quantity: cart[k], expected_price: p ? p.price : null };
      }),
    };

    var btn = document.getElementById('submit-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Uploading receipt\u2026'; }

    // Try presigned direct upload first; fall back to multipart.
    var receiptKey = null;
    try {
      var urlResp = await fetch('/api/public/' + encodeURIComponent(slug) + '/receipt-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: receiptFile.name, content_type: receiptFile.type }),
      });
      if (urlResp.ok) {
        var urlData = await urlResp.json();
        var putResp = await fetch(urlData.upload_url, {
          method: 'PUT',
          headers: { 'Content-Type': receiptFile.type },
          body: receiptFile,
        });
        if (putResp.ok) receiptKey = urlData.key;
      }
    } catch (e) { /* fall through to multipart */ }

    if (receiptKey) payload.receipt_key = receiptKey;

    var fd = new FormData();
    fd.append('data', JSON.stringify(payload));
    if (!receiptKey) fd.append('receipt', receiptFile);

    if (btn) btn.textContent = 'Sending\u2026';

    try {
      var r = await fetch('/api/public/' + encodeURIComponent(slug) + '/orders', { method: 'POST', body: fd });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        if (btn) { btn.disabled = false; btn.textContent = 'I\u2019ve paid \u2014 send order'; }
        var msg = typeof d.detail === 'string' ? d.detail : ((d.detail && d.detail.message) || 'Could not submit your order. Please try again.');
        alert(msg);
        return;
      }
      step = 'success';
      renderSheet();
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'I\u2019ve paid \u2014 send order'; }
      alert('Network error. Please try again.');
    }
  };

  if (!slug) { showError('This order link is missing a business code.'); return; }

  document.getElementById('chips').addEventListener('click', function (e) {
    var t = e.target.closest('.chip'); if (!t) return;
    currentCat = t.getAttribute('data-cat') || '';
    renderChips(); renderProducts();
  });

  fetch('/api/public/' + encodeURIComponent(slug), { headers: { 'Accept': 'application/json' } })
    .then(function (r) {
      if (r.status === 404) { showError('This order link doesn\u2019t match any business.'); return null; }
      if (!r.ok) { showError('Could not load this page. Please try again.'); return null; }
      return r.json();
    })
    .then(function (d) {
      if (!d) return;
      data = d;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.title = d.business_name + ' \u2014 Order';
      document.getElementById('brand-name').textContent = d.business_name;
      document.getElementById('hero-title').textContent = 'Order from ' + d.business_name;
      var logoEl = document.getElementById('brand-logo');
      paintLogo(logoEl, d.business_logo, (d.business_name || '?').charAt(0).toUpperCase());
      renderChips();
      renderProducts();
    })
    .catch(function () { showError('Could not load this page. Please check your connection.'); });
})();
</script>
</body>
</html>
