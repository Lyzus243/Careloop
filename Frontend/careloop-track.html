<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f7fb; color: #1f2937; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .sub { color: #6b7280; font-size: .9rem; margin-bottom: 18px; }
  form { display: flex; gap: 8px; margin-bottom: 18px; }
  input { flex: 1; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; text-transform: uppercase; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: #3730c9; color: #fff; font-weight: 600; font-size: 1rem; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
  .card[hidden] { display: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: #9ca3af; }
  li .dot { width: 14px; height: 14px; border-radius: 50%; background: #e5e7eb; flex: none; }
  li.done { color: #374151; }
  li.done .dot { background: #16a34a; }
  li.current { color: #111827; font-weight: 700; }
  li.current .dot { background: #3730c9; box-shadow: 0 0 0 4px #e0e7ff; }
  .meta { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e5e7eb; font-size: .88rem; color: #4b5563; line-height: 1.6; }
  #msg { color: #6b7280; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="biz">Track your order</h1>
  <div class="sub" id="codeline">Enter your tracking code</div>
  <form id="f">
    <input id="code" type="text" placeholder="e.g. CL-7K3M9P" autocomplete="off">
    <button type="submit">Track</button>
  </form>
  <div id="msg"></div>
  <div class="card" id="card" hidden>
    <ul id="stages"></ul>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var parts = location.pathname.split("/").filter(Boolean);
  var code = (parts[0] === "track" && parts[1]) ? decodeURIComponent(parts[1]) : "";
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var c = $("code").value.trim().toUpperCase();
    if (c) location.href = "/track/" + encodeURIComponent(c);
  });
  if (!code) return;
  $("code").value = code.toUpperCase();
  $("msg").textContent = "Loading...";
  fetch("/api/public/track/" + encodeURIComponent(code))
    .then(function (r) {
      if (r.status === 404) { $("msg").textContent = "We could not find that code. Check it and try again."; return null; }
      if (!r.ok) { $("msg").textContent = "Something went wrong. Please try again."; return null; }
      return r.json();
    })
    .then(function (d) { if (d) render(d); })
    .catch(function () { $("msg").textContent = "No connection. Please try again."; });

  function render(d) {
    $("msg").textContent = "";
    $("biz").textContent = d.business_name;
    $("codeline").textContent = "Order " + d.tracking_code;
    $("card").hidden = false;
    var ul = $("stages");
    if (!d.enabled) {
      ul.textContent = "Stage updates are not turned on for this order.";
      return;
    }
    d.stages.forEach(function (name, i) {
      var li = document.createElement("li");
      li.className = i < d.current_index ? "done" : (i === d.current_index ? "current" : "");
      var dot = document.createElement("span");
      dot.className = "dot";
      var label = document.createElement("span");
      label.textContent = name;
      li.appendChild(dot);
      li.appendChild(label);
      ul.appendChild(li);
    });
    var lines = [];
    if (d.items && d.items.length) lines.push("Your order: " + d.items.join(", "));
    if (d.due_date) lines.push("Due: " + new Date(d.due_date + "T00:00:00").toLocaleDateString());
    $("meta").textContent = lines.join("\n");
    $("meta").style.whiteSpace = "pre-line";
    if (!lines.length) $("meta").style.display = "none";
  }
})();
</script>
</body>
</html>
