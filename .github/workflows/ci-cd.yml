name: Careloop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    env:
      # Both are read at import time. Falling back to a literal keeps the check
      # working in forks and before the repository secrets are configured.
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy-ci-secret-key-for-import-check' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-ci-key' }}
      DATABASE_URL: sqlite+aiosqlite:///ci.db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check FastAPI Import
        run: |
          python -c "from app.main import app"

      - name: Check Python 3.11 Compatibility
        # Render does not pin a version for us, so the code must parse on the
        # oldest interpreter it might get. StrEnum sets the floor at 3.11.
        run: |
          python -c "
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('app').rglob('*.py'):
              try:
                  compile(p.read_text(encoding='utf-8'), str(p), 'exec', ast.PyCF_ONLY_AST, dont_inherit=True)
              except SyntaxError as e:
                  bad.append(f'{p}:{e.lineno} {e.msg}')
          print('\n'.join(bad) or 'all files parse')
          sys.exit(1 if bad else 0)
          "

      - name: Run Alembic Validation
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
            alembic current
          fi

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Build Frontend
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "No frontend build required"
          fi

  deploy:
    name: Render Deploy
    needs:
      - backend-test
      - frontend-build

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping explicit trigger."
            echo "If Render's own auto-deploy-on-push is enabled for this repo, no action is needed here."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
